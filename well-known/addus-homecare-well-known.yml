description: >-
  Record of the /.well-known/ discovery probe against every Addus HomeCare host. Nothing is served.
  The corporate site (addus.com, WordPress + Yoast) answers its own styled 404 page with HTTP 404 for
  every well-known path, and connect.addus.com is a single-page application whose catch-all returns
  HTTP 200 with an HTML shell for every path — including paths that do not exist — so none of its
  200s is a document. No WellKnown or SecurityTxt pointer is emitted from this file: a recorded
  absence is data, not a presence.
