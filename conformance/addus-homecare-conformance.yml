provider: Addus HomeCare
providerId: addus-homecare
description: >-
  Standards conformance for Addus HomeCare, a US personal care, home health and hospice services
  provider (NASDAQ: ADUS). Addus publishes no machine-readable API contract of any kind, so no
  technical conformance assertion can be made from a spec — every entry below that concerns a
  contract-level standard is recorded as not-assessable rather than false, because there is nothing
  to read. The one thing Addus does publish is the regulatory posture required of a HIPAA covered
  entity, and that is recorded with the document URL that states it.
scope: >-
  Assessed against the Health regulatory regime's standards shortlist (fhir, smart-on-fhir, us-core,
  uscdi, da-vinci, carin-blue-button, fhir-bulk-data, cds-hooks, c-cda, hl7-v2, dicom) plus the
  cross-cutting API standards this pipeline checks.
