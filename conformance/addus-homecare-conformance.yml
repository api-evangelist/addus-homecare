        status: 200
        note: >-
          HIPAA Notice of Privacy Practices, effective 2025-12-01, published as a PDF and linked from
          the site privacy policy. This is the legally required patient notice of a covered entity,
          not an API compliance attestation, and is recorded as such.
      - type: document
