description: Addus HomeCare publishes no developer-facing API, so there is no rate-limit surface to document.
  Contract discovery on 2026-08-30 probed every OpenAPI, GraphQL, MCP and /.well-known/ path against addus.com
  and the two Addus subdomains that resolve, and found nothing; api.addus.com and developer.addus.com
  do not resolve at all. limit_count is an honest zero. Where system-to-system integrations exist (CellTrak
  EVV, Homecare Homebase, payer X12 EDI), throughput is governed by partner-specific data-sharing agreements
  rather than by Addus-published limits.
sources:
- https://addus.com
- https://addus.com/sitemap_index.xml
notes: No response headers to record — there is no callable Addus endpoint to observe. The only JSON endpoint
  on the corporate host is WordPress core at /wp-json/, which returns 401 rest_not_logged_in to anonymous
  callers and is CMS infrastructure, not a product API.
