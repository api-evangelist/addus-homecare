x-type: company
description: 'Addus HomeCare Corporation (NASDAQ: ADUS) is a US provider of personal care, home health
  and hospice services delivered in the home and community, headquartered at 6303 Cowboys Way, Frisco,
  Texas. It serves consumers across roughly three dozen states through a large field workforce of caregivers,
  nurses and therapists, with revenue coming predominantly from Medicaid and Medicaid-managed-care programs,
  Medicare and managed-care payers rather than from software. Addus is a care-delivery organization, not
  a software vendor: contract discovery on 2026-08-30 found no developer program, no public API, no SDK,
  no published package on any registry and no machine-readable contract of any kind. Its clinical and
  operational systems are supplied by partners — Homecare Homebase for the home-based care platform under
  a joint development agreement announced in April 2021, and CellTrak for Electronic Visit Verification
  — and any system-to-system exchange (HL7, payer X12 EDI, state EVV aggregators) is scoped by partner
  contract rather than by a public developer portal. Two earlier hosts on this profile, api.addus.com
  and developer.addus.com, were probed and do not resolve; they have been removed.'
